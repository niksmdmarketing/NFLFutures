name: Research - NBA pre-game official reports (one job per season)
# Collects, for every regular-season game of the chosen seasons, the latest official NBA injury report published before
# that game's cutoff (research/nba_official_pregame.py). Seasons run in parallel; each job commits its own file to the
# market-data branch. Research only: nothing here feeds the site.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "JSON list of season end years, e.g. [2022, 2023]"
        default: "[2022, 2023, 2024, 2025]"
      mode:
        description: "collect (pre-game report selection), verify (printed time, hash, Last-Modified) or reparse (corrected parser + PDFs as release assets)"
        default: "collect"
permissions:
  contents: write
jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(inputs.seasons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          PREGAME_BUDGET_S: "16800"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin market-data
          git worktree add -q -B market-data ../market-data FETCH_HEAD
          if [ "${{ inputs.mode }}" = "reparse" ]; then
            python research/nba_pregame_reparse.py ${{ matrix.year }} ../market-data ../pdfs
          elif [ "${{ inputs.mode }}" = "verify" ]; then
            python research/nba_pregame_verify.py ${{ matrix.year }} ../market-data
          else
            python research/nba_official_pregame.py ${{ matrix.year }} ${{ matrix.year }} ../market-data
          fi
      - name: Publish original PDFs (release asset, one zip per season, files named by SHA-256)
        if: ${{ inputs.mode == 'reparse' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ../pdfs && zip -q -r ../nba-official-reports-${{ matrix.year }}.zip . && cd ..
          ls -la nba-official-reports-${{ matrix.year }}.zip
          gh release view nba-official-reports -R ${{ github.repository }} > /dev/null 2>&1 || \
            gh release create nba-official-reports -R ${{ github.repository }} --title "NBA official injury reports (research archive)" \
              --notes "Original league PDFs selected as the latest report published 60+ minutes before each regular-season tip-off. Files are named <sha256>.pdf; the mapping is research/nba_pregame/reparse_v2_<season>_reports.json on the market-data branch. Research only." || true
          for i in 1 2 3 4; do
            gh release upload nba-official-reports nba-official-reports-${{ matrix.year }}.zip -R ${{ github.repository }} --clobber && break
            sleep $((RANDOM % 20 + 5))
          done
      - name: Save
        if: always()
        run: |
          cd ../market-data
          git add -A research/nba_pregame
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "NBA pre-game official reports ${{ matrix.year }} (${{ inputs.mode }})"
          for i in 1 2 3 4 5 6; do
            if git push -q origin HEAD:market-data; then exit 0; fi
            git pull -q --rebase origin market-data || exit 1
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
