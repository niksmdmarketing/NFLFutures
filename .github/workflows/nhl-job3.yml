name: NHL Job 3 carry-forward replay (research)
# research/NEWS_IN_FUTURES_RULE.md Job 3. Workflow drafted by DeepSeek (relay 031), checked by Claude. Results only, never the site.
on:
  push:
    branches: [main]
    paths: [research/nhl_job3_trigger.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy
      - name: Build NHL data
        run: cd pipeline && python -c "import nhl; nhl.build_data()"
      - name: Null and carry arms (live settings except the RAPM lineup values, which need a cache the runner lacks)
        run: |
          F="BT_SIMS=2000 NHL_SHOT_W=1 NHL_SHOT_PO=1 NHL_RS_SHOT_W=0.2 NHL_RS_XG=raw NHL_PO_FADE=3 NHL_OT_FIX=1 NHL_OT_EDGE=0.5 NHL_LINEUP_C=1 NHL_LINEUP_N=5 NHL_LINEUP_PRE=0 NHL_LINEUP_GS=0.438"
          mkdir -p out/null out/carry
          env $F BT_OUTDIR=out/null python research/replay_nhl.py build/nhl 2015 2025 > out/null/log.txt 2>&1 &
          env $F NHL_CARRY=1 BT_OUTDIR=out/carry python research/replay_nhl.py build/nhl 2015 2025 > out/carry/log.txt 2>&1 &
          wait
          tail -5 out/null/log.txt out/carry/log.txt
      - name: Commit results to research-results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/res && cp -r out /tmp/res/
          if git fetch -q origin research-results; then git checkout -q research-results; else git checkout -q --orphan research-results; git rm -rq --cached . ; rm -rf ./* .github; fi
          mkdir -p nhl_job3 && rm -rf nhl_job3/* && cp -r /tmp/res/out/* nhl_job3/
          git add -f nhl_job3 && git commit -qm "NHL Job 3 results $GITHUB_SHA" || echo "no change"
          for i in 1 2 3; do git push -q origin research-results && break || sleep 15; done
