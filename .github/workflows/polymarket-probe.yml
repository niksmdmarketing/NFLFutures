name: Polymarket research (manual)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "research script to run"
        default: "research/polymarket_probe.py"
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare market-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin market-data > /dev/null; then
            git fetch -q origin market-data
            git worktree add -q -B market-data ../market-data FETCH_HEAD
          else
            git worktree add -q --orphan -b market-data ../market-data
          fi
      - run: python ${{ inputs.script }} ../market-data
      - name: Save
        run: |
          cd ../market-data
          git add -A
          if ! git diff --cached --quiet; then git commit -q -m "Market data $(date -u +%Y-%m-%dT%H:%MZ)"; git push -q origin market-data; fi
