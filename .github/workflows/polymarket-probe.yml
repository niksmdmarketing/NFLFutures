name: Polymarket probe (research, manual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python research/polymarket_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: polymarket-probe
          path: probe/
          retention-days: 3
