name: Refresh site

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), 17 minutes past
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore nflverse downloads
        uses: actions/cache@v4
        with:
          path: data
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Test the NFL injury monitor
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      # Collection only: nothing in ratings, simulations or awards reads this. Its history lives on the append-only
      # injury-monitor branch (not the evictable cache, not the published site). A failure marks this step red
      # but never stops the other sports.
      - name: NFL injury monitor (collection only)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin injury-monitor > /dev/null; then
            git fetch -q origin injury-monitor
            git worktree add -q -B injury-monitor ../injury-monitor FETCH_HEAD
          else
            git worktree add -q --orphan -b injury-monitor ../injury-monitor
          fi
          set +e
          python pipeline/nfl_injuries.py --store ../injury-monitor
          status=$?
          set -e
          cd ../injury-monitor
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Injury report check $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin injury-monitor
          fi
          exit $status

      - name: Check out the Shiv archive (model + market quotes, append-only)
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin shiv-archive > /dev/null; then
            git fetch -q origin shiv-archive
            git worktree add -q -B shiv-archive ../shiv-archive FETCH_HEAD
          else
            git worktree add -q --orphan -b shiv-archive ../shiv-archive
          fi

      - name: Build data and site
        env:
          SHIV_ARCHIVE: ../shiv-archive
        run: python pipeline/run.py

      - name: Archive this refresh's Shiv record
        continue-on-error: true
        run: |
          if [ -f build/shiv_record.json.gz ] && [ -d ../shiv-archive ]; then
            d=../shiv-archive/records/$(date -u +%Y-%m)
            mkdir -p "$d"
            cp build/shiv_record.json.gz "$d/$(date -u +%Y%m%dT%H%MZ).json.gz"
            cd ../shiv-archive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then git commit -q -m "Shiv record $(date -u +%Y-%m-%dT%H:%MZ)"; git push -q origin shiv-archive; fi
          fi

      - name: Save history for newly completed seasons
        run: |
          if [ -n "$(git status --porcelain history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history
            git commit -q -m "Add completed-season history [skip ci]"
            git push -q
          fi

      - name: Archive forecasts (append-only forecast-archive branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin forecast-archive > /dev/null; then
            git fetch -q origin forecast-archive
            git worktree add -q -B forecast-archive ../archive FETCH_HEAD
          else
            git worktree add -q --orphan -b forecast-archive ../archive
          fi
          python pipeline/archive.py ../archive
          cd ../archive
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Forecast snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin forecast-archive
          fi

      - name: Publish to the published branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" published
