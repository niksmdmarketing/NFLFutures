name: Collect MoneyPuck player summaries (research)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pandas
      - name: Collect
        run: python research/mp_collect.py 2010 2025 2>&1 | tee mp_collect.log
      - name: Save
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/research/mp
          if ! git diff --cached --quiet; then
            git commit -q -m 'Research: MoneyPuck player season summaries'
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
