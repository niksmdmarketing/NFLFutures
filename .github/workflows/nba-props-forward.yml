name: Research - NBA props forward archive
# Forward test of the NBA prop models (research/NBA_MINUTES_M2B_RULE.md, forward-test protocol). GitHub's cron on this repository
# runs hours late, so one job loops: every 15 minutes it runs research/nba_props_live.py (forecasts for games whose 1-hour or 6-hour
# cutoff falls within the next 45 minutes) and commits to forecast-archive (nba/props_forward/). After ~5.5 hours it dispatches its
# successor if more cutoffs remain in the next 24 hours. Scheduled starts are backups. Research only: nothing here feeds the site.
# Manual runs with a game id are single test runs written to .../tests/.
on:
  schedule:
    - cron: "5 9,15,21 * * *"
  workflow_dispatch:
    inputs:
      force_game:
        description: "Test only: ESPN game id to forecast now (written to nba/props_forward/tests/)"
        default: ""
      horizon:
        description: "Test only: 60 or 360"
        default: "60"
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-props-forward
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Team mapping self-test (all 30 teams; fails the run on any mismatch)
        run: python research/nba_teams.py
      - name: Forecast loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin forecast-archive
          git worktree add -q -B forecast-archive ../archive FETCH_HEAD
          # save(): commit anything new, then push whatever is not yet on the remote (including commits left by an earlier failed push).
          # A failed push is reported as an error and retried at the next save; the loop keeps forecasting, and the job ends red.
          save() {
            ( cd ../archive
              git add -A nba/props_forward || return 1
              if ! git diff --cached --quiet; then
                git commit -q -m "NBA props forward archive $(date -u +%Y-%m-%dT%H:%MZ)" || return 1
              fi
              git fetch -q origin forecast-archive || true
              if [ -z "$(git rev-list FETCH_HEAD..HEAD)" ]; then return 0; fi
              for i in 1 2 3 4 5; do
                git pull -q --rebase origin forecast-archive && git push -q origin HEAD:forecast-archive && return 0
                sleep $((RANDOM % 20 + 5))
              done
              echo "::error::Forecast archive push failed after five attempts"
              return 1 )
          }
          failed=0
          if [ -n "${{ inputs.force_game }}" ]; then
            python research/nba_props_live.py ../archive --force-game "${{ inputs.force_game }}" --horizon "${{ inputs.horizon }}"
            save
            exit $?
          fi
          start=$(date +%s); it=0
          while [ $(( $(date +%s) - start )) -lt 18900 ]; do      # 5.25 hours (leaves room for the hand-over within the 350-minute job limit)
            python research/nba_props_live.py ../archive || echo "forecaster error (logged in runs/)"
            save || failed=1
            it=$((it + 1))
            if [ $((it % 4)) -eq 0 ]; then   # about hourly: server-recorded push receipts (the scheduled timing workflow is often skipped by GitHub)
              timeout 240 python research/nba_props_forward_timing.py ../archive || echo "::warning::timing receipt collection failed"
              save || failed=1
            fi
            now=$(date +%s); next=$(( (now / 900 + 1) * 900 + 60 ))   # one minute past the next quarter hour
            sleep $(( next - now ))
          done
          # hand over to a successor if any cutoff remains in the next 24 hours
          if python research/nba_props_live.py ../archive --pending-hours 24; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/nba-props-forward.yml/dispatches -f ref=main && echo "successor dispatched"
          fi
          timeout 240 python research/nba_props_forward_timing.py ../archive || echo "::warning::timing receipt collection failed"
          save || failed=1
          exit $failed
