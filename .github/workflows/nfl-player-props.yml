name: NFL player forecast archive

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-player-props
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: nfl-props-${{ github.run_id }}
          restore-keys: nfl-props-
      - name: Check out timestamped availability inputs
        run: |
          git fetch -q origin injury-monitor
          git worktree add -q -B injury-monitor ../injury-monitor FETCH_HEAD
      - name: Check out create-only forecast archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin nfl-props-archive > /dev/null; then
            git fetch -q origin nfl-props-archive
            git worktree add -q -B nfl-props-archive ../nfl-props-archive FETCH_HEAD
          else
            git worktree add -q --orphan -b nfl-props-archive ../nfl-props-archive
          fi
      - name: Check out separate create-only challenger archive
        run: |
          if git ls-remote --exit-code --heads origin nfl-props-challenger-archive > /dev/null; then
            git fetch -q origin nfl-props-challenger-archive
            git worktree add -q -B nfl-props-challenger-archive ../nfl-props-challenger-archive FETCH_HEAD
          else
            git worktree add -q --orphan -b nfl-props-challenger-archive ../nfl-props-challenger-archive
          fi
      - name: Check out create-only v1.1 archive (displayed version since 26 Oct 2026)
        continue-on-error: true   # v1.1 problems must never block the v1 baseline archive
        run: |
          if git ls-remote --exit-code --heads origin nfl-props-v11-archive > /dev/null; then
            git fetch -q origin nfl-props-v11-archive
            git worktree add -q -B nfl-props-v11-archive ../nfl-props-v11-archive FETCH_HEAD
          else
            git worktree add -q --orphan -b nfl-props-v11-archive ../nfl-props-v11-archive
          fi
      - name: Check out create-only v1.2 matchup shadow archive (not displayed)
        continue-on-error: true   # v1.2 problems must never block v1 or v1.1
        run: |
          if git ls-remote --exit-code --heads origin nfl-props-v12-archive > /dev/null; then
            git fetch -q origin nfl-props-v12-archive
            git worktree add -q -B nfl-props-v12-archive ../nfl-props-v12-archive FETCH_HEAD
          else
            git worktree add -q --orphan -b nfl-props-v12-archive ../nfl-props-v12-archive
          fi
      - name: Forecast from the latest information available now
        run: python pipeline/nfl_props.py forecast --availability ../injury-monitor --archive ../nfl-props-archive --output ../nfl-props-baseline.json
      - name: Run the aligned-input challenger in shadow
        run: python pipeline/nfl_props_challenger.py --availability ../injury-monitor --baseline ../nfl-props-baseline.json --archive ../nfl-props-challenger-archive
      - name: v1.1 from the same baseline inputs and time
        continue-on-error: true   # v1.1 problems must never block the v1 baseline archive
        run: python pipeline/nfl_props_v11.py --baseline ../nfl-props-baseline.json --archive ../nfl-props-v11-archive --output ../nfl-props-v11.json
      - name: v1.2 matchup shadow from the same v1.1 forecast
        continue-on-error: true   # v1.2 problems must never block v1 or v1.1
        run: python pipeline/nfl_props_v12.py --v11 ../nfl-props-v11.json --archive ../nfl-props-v12-archive
      - name: Score v1.2 forecasts independently after results arrive
        continue-on-error: true
        run: |
          mkdir -p ../nfl-props-v12-archive/scores
          python pipeline/nfl_props_score.py ../nfl-props-v12-archive --horizon 60 --output ../nfl-props-v12-archive/scores/60.json || true
          python pipeline/nfl_props_score.py ../nfl-props-v12-archive --horizon 360 --output ../nfl-props-v12-archive/scores/360.json || true
      - name: Score v1.1 forecasts independently after results arrive
        continue-on-error: true   # v1.1 problems must never block the v1 baseline archive
        run: |
          mkdir -p ../nfl-props-v11-archive/scores
          python pipeline/nfl_props_score.py ../nfl-props-v11-archive --horizon 60 --output ../nfl-props-v11-archive/scores/60.json || true
          python pipeline/nfl_props_score.py ../nfl-props-v11-archive --horizon 360 --output ../nfl-props-v11-archive/scores/360.json || true
      - name: Score shadow forecasts independently after results arrive
        run: |
          mkdir -p ../nfl-props-challenger-archive/scores
          python pipeline/nfl_props_score.py ../nfl-props-challenger-archive --horizon 60 --output ../nfl-props-challenger-archive/scores/60.json || true
          python pipeline/nfl_props_score.py ../nfl-props-challenger-archive --horizon 360 --output ../nfl-props-challenger-archive/scores/360.json || true
      - name: Score independently received forecasts after results arrive
        run: |
          mkdir -p ../nfl-props-archive/scores
          python pipeline/nfl_props_score.py ../nfl-props-archive --horizon 60 --output ../nfl-props-archive/scores/60.json || true
          python pipeline/nfl_props_score.py ../nfl-props-archive --horizon 360 --output ../nfl-props-archive/scores/360.json || true
      - name: Save immutable snapshot
        run: |
          cd ../nfl-props-archive
          git add snapshots index.jsonl scores 2>/dev/null || git add snapshots index.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "NFL player forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin nfl-props-archive && exit 0; git pull -q --rebase origin nfl-props-archive; sleep 5; done
          exit 1
      - name: Save separate immutable challenger snapshot
        run: |
          cd ../nfl-props-challenger-archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots index.jsonl scores 2>/dev/null || git add snapshots index.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "NFL player props challenger $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin nfl-props-challenger-archive && exit 0; git pull -q --rebase origin nfl-props-challenger-archive; sleep 5; done
          exit 1
      - name: Save immutable v1.1 snapshot
        continue-on-error: true   # v1.1 problems must never block the v1 baseline archive
        run: |
          cd ../nfl-props-v11-archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots index.jsonl scores 2>/dev/null || git add snapshots index.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "NFL player props v1.1 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin nfl-props-v11-archive && exit 0; git pull -q --rebase origin nfl-props-v11-archive; sleep 5; done
          exit 1
      - name: Save immutable v1.2 snapshot
        continue-on-error: true   # v1.1 problems must never block v1 or v1.1
        run: |
          cd ../nfl-props-v12-archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots index.jsonl scores 2>/dev/null || git add snapshots index.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "NFL player props v1.2 shadow $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -q origin nfl-props-v12-archive && exit 0; git pull -q --rebase origin nfl-props-v12-archive; sleep 5; done
          exit 1
