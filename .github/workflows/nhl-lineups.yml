name: Collect NHL per-game lineups (research)
on:
  schedule:
    - cron: "41 14 * * *"   # daily: refresh the current season (the live roster term reads it; 16 Oct 2026)
  workflow_dispatch:
    inputs:
      first:
        default: "2014"
      last:
        default: "2026"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: |
          Y=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month >= 8 else t.year - 1)")
          python research/nhl_lineups_collect.py ${{ inputs.first || '$Y' }} ${{ inputs.last || '$Y' }}
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/research/nhl_lineups || true
          if ! git diff --cached --quiet; then git commit -q -m 'Research: NHL per-game lineups'; git pull -q --rebase origin main; git push origin HEAD:main; fi
