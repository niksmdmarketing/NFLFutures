name: Collect NBA research data

on:
  schedule:
    - cron: "43 8 * * *" # once daily, separate from the site refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-research-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore research-data cache
        uses: actions/cache@v4
        with:
          path: data/nba/research
          key: nba-research-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nba-research-${{ runner.os }}-
      - name: Collect bounded season files for validation
        run: python pipeline/nba_research_collect.py --seasons 12 --max-file-mb 75 --max-total-mb 1200
      - name: Save collection inventory
        uses: actions/upload-artifact@v4
        with:
          name: nba-research-inventory-${{ github.run_id }}
          path: build/nba_research_collection.json
          retention-days: 30
