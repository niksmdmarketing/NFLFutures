name: Collect NHL player bios (research)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pandas
      - run: python research/nhl_bios_collect.py
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/research/nhl_bios.csv || true
          if ! git diff --cached --quiet; then git commit -q -m 'Research: NHL player bios'; git pull -q --rebase origin main; git push origin HEAD:main; fi
